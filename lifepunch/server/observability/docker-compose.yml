# LifePunch CVL Phase 1 — Prometheus + Blackbox + Grafana (lifepunchnet)
# Rendered configs live in ./rendered/ (generated by deploy-observability.ps1 — never commit secrets)

services:
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lifepunch-blackbox
    restart: unless-stopped
    volumes:
      - ./rendered/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lifepunch-prometheus
    restart: unless-stopped
    volumes:
      - ./rendered/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9091:9090'
    depends_on:
      - blackbox
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.2.2
    container_name: lifepunch-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
