name: regression sensors

# Read-only PR sensors. They report regressions; Bloodwave remains the merge gate.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: regression-sensors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cite-census:
    name: cite census (no new unresolved identity)
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim runner disk for corpus checkouts
        shell: bash
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android
          df -h /

      - name: Check out PR merge candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: repo
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve merge candidate as a linked worktree
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: git -C "$env:GITHUB_WORKSPACE/repo" worktree add --detach "$env:GITHUB_WORKSPACE/head" $env:CANDIDATE_SHA

      - name: Check out PR base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned public DXRP corpus
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mragerlp/dxrp-public
          ref: e6d3026a52a42045a56db44aa9db9b75ab93d2cc
          path: dxrp
          fetch-depth: 1
          persist-credentials: false

      - name: Fast regression-gate contract tests
        shell: pwsh
        run: ./head/lifepunch/scripts/tests/Assert-CiteCensusRegression.Tests.ps1

      - name: Select trusted enforcement scripts
        shell: pwsh
        run: |
          $baseComparator = Join-Path $env:GITHUB_WORKSPACE 'repo/lifepunch/scripts/Assert-CiteCensusRegression.ps1'
          $baseDetector = Join-Path $env:GITHUB_WORKSPACE 'repo/lifepunch/scripts/Invoke-CiteCensus.ps1'
          if ((Test-Path -LiteralPath $baseComparator -PathType Leaf) -and (Test-Path -LiteralPath $baseDetector -PathType Leaf)) {
            Write-Output 'ENFORCEMENT: using the PR base Assert-CiteCensusRegression and detector.'
            "ENFORCEMENT_ROOT=$env:GITHUB_WORKSPACE/repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            Write-Warning 'BOOTSTRAP FALLBACK: PR base lacks the enforcement scripts; using head for this first landing only.'
            "ENFORCEMENT_ROOT=$env:GITHUB_WORKSPACE/head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Compare base and head cite censuses
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DXRP_SHA: e6d3026a52a42045a56db44aa9db9b75ab93d2cc
        run: |
          $comparator = Join-Path $env:ENFORCEMENT_ROOT 'lifepunch/scripts/Assert-CiteCensusRegression.ps1'
          $detector = Join-Path $env:ENFORCEMENT_ROOT 'lifepunch/scripts/Invoke-CiteCensus.ps1'
          & pwsh -NoLogo -NoProfile -File $comparator `
            -BaseRepoRoot "$env:GITHUB_WORKSPACE/repo" `
            -HeadRepoRoot "$env:GITHUB_WORKSPACE/head" `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -DxrpRoot "$env:GITHUB_WORKSPACE/dxrp" `
            -ExpectedDxrpSha $env:DXRP_SHA `
            -CensusScriptPath $detector
          exit $LASTEXITCODE

  bridge-version-contract:
    name: bridge version assertion (positive presence)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted PR base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Assert live fixture passes and null/null false-green fails
        shell: pwsh
        run: |
          $assertion = Join-Path $env:GITHUB_WORKSPACE 'base/lifepunch/scripts/Assert-BridgeVersion.ps1'
          $good = @{
            bridgeVersion = '1.2.3'
            mcpServerVersion = '1.2.3'
            connected = $true
            roundTripOk = $true
            versionsAligned = $true
          } | ConvertTo-Json -Compress
          $good | & pwsh -NoLogo -NoProfile -File $assertion
          if ($LASTEXITCODE -ne 0) {
            throw "Assert-BridgeVersion rejected the truthful live fixture (exit $LASTEXITCODE)."
          }

          $falseGreen = @{
            bridgeVersion = $null
            mcpServerVersion = $null
            connected = $false
            roundTripOk = $false
            versionsAligned = $true
          } | ConvertTo-Json -Compress
          $falseGreen | & pwsh -NoLogo -NoProfile -File $assertion
          if ($LASTEXITCODE -eq 0) {
            throw 'Assert-BridgeVersion accepted the null/null disconnected false-green fixture.'
          }
          Write-Output "BRIDGE-CONTRACT: PASS - live fixture accepted; false-green fixture rejected with exit $LASTEXITCODE."
          exit 0
