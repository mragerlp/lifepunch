name: LifePunch Discord Commit Log

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Send commit summary
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMIT_WEBHOOK_URL }}
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;

            if (!webhookUrl) {
              core.setFailed('DISCORD_COMMIT_WEBHOOK_URL secret is not configured.');
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branch = context.ref.replace('refs/heads/', '');
            const sender = context.payload.sender?.login ?? 'unknown';
            const commits = context.payload.commits ?? [];
            const compareUrl = context.payload.compare;

            const commitLines = commits.length
              ? commits.slice(0, 10).map((commit) => {
                  const sha = commit.id.substring(0, 7);
                  const message = commit.message.split('\n')[0];
                  const author = commit.author?.name ?? 'unknown';
                  return `[\`${sha}\`](${commit.url}) ${message} - ${author}`;
                }).join('\n')
              : `Manual workflow run by ${sender}.`;

            const payload = {
              username: 'LifePunch GitHub',
              embeds: [
                {
                  title: commits.length === 1
                    ? `1 new commit pushed to ${repo}`
                    : `${commits.length || 'Manual'} commit update for ${repo}`,
                  url: compareUrl || `https://github.com/${repo}/actions/runs/${context.runId}`,
                  color: 0x7c3aed,
                  fields: [
                    { name: 'Branch', value: branch || 'manual', inline: true },
                    { name: 'Pushed by', value: sender, inline: true },
                    { name: 'Commits', value: commitLines.slice(0, 3900) }
                  ],
                  timestamp: new Date().toISOString()
                }
              ]
            };

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Discord webhook returned ${response.status}: ${body}`);
            }
